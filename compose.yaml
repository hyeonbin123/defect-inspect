# 검사 서비스를 Docker로 띄우는 설정(`docker compose up --build`, README 검사 서비스 절).
services:
  inspect:
    build: .
    # 이 PC(127.0.0.1)에서만 열리게 묶는다. 다른 기계에서 접속하게 하려면 주소와 아래 허용 Host를 함께 바꾸고, TLS를 끝내고
    # 본문 읽기 시간·크기·연결 수를 제한하는 리버스 프록시 뒤에 둔다. 관리자 토큰은
    # `python -c "import secrets; print(secrets.token_urlsafe(32))"`처럼 만들어 환경 변수(.env)로 준다(README 검사 서비스 절).
    ports:
      - "127.0.0.1:8093:8000"
    environment:
      DEFECT_INSPECT_ARTIFACTS: /artifacts
      # 모델 정밀도: fp32(서빙 기본) 또는 int8-dynamic. 아티팩트의 임계값은 FP32 점수로 정한 것이다(README).
      DEFECT_INSPECT_PRECISION: ${DEFECT_INSPECT_PRECISION:-fp32}
      # 서비스가 응답할 Host 이름(쉼표로 구분). 포트를 127.0.0.1 밖으로 열기 전에 이 기계의 이름이나 주소를 더한다.
      DEFECT_INSPECT_ALLOWED_HOSTS: ${DEFECT_INSPECT_ALLOWED_HOSTS:-localhost,127.0.0.1}
      # POST /calibrate(임계값 바꾸기)는 여기에 토큰을 설정하기 전까지 꺼져 있다. 호출하는 쪽은 그 값을
      # X-Admin-Token 헤더로 보낸다.
      DEFECT_INSPECT_ADMIN_TOKEN: ${DEFECT_INSPECT_ADMIN_TOKEN:-}
      # 동시에 디코딩·채점하는 스레드 수(기본 2)와 작업자를 기다릴 수 있는 요청 수(기본 16). 비우면 기본값. 둘의 합을 넘는
      # 업로드 요청은 503(Retry-After)으로 거절된다. 재보정 상태는 프로세스 메모리에만 있어 uvicorn 작업자 프로세스를
      # 늘리지 않으므로(Dockerfile), 처리량은 이 두 값으로 조절한다.
      DEFECT_INSPECT_WORKERS: ${DEFECT_INSPECT_WORKERS:-}
      DEFECT_INSPECT_QUEUE: ${DEFECT_INSPECT_QUEUE:-}
      # 모델 세션 하나가 쓰는 onnxruntime 연산 스레드 수. 비우면 onnxruntime 기본값(호스트의 물리 코어 수)이다. 이 서비스에
      # cpus: 로 CPU 제한을 걸면 기본값은 그 제한을 따르지 않으므로 제한한 코어 수로 맞춘다.
      DEFECT_INSPECT_THREADS: ${DEFECT_INSPECT_THREADS:-}
    volumes:
      # 아티팩트 세트: 6단계의 서빙 Dinomaly ViT-S 모델(`dinomaly_serving export` + `calibrate`: ONNX 모델 하나,
      # 범주마다 임계값) 또는 `defect_inspect.export`의 PatchCore 세트. 읽기 전용으로 마운트한다.
      - ${DEFECT_INSPECT_ARTIFACT_DIR:-./artifacts/dms-280-car}:/artifacts:ro
    # 컨테이너 루트 파일 시스템을 읽기 전용으로 둔다(쓸 곳은 아래 /tmp뿐).
    read_only: true
    # 1MB가 넘는 업로드 파일은 요청을 해석하는 동안 여기에 임시로 쓰인다(Starlette의 SpooledTemporaryFile). tmpfs는
    # 메모리 한도에 포함된다. 크기는 서비스가 동시에 받아 둘 수 있는 업로드의 최대 합으로 잡았다: 서비스는 진행 중인
    # 업로드 요청(POST /inspect와 /calibrate)을 작업자 + 대기열(기본 2 + 16 = 18개)로 묶고 넘으면 본문을 받기 전에
    # 503을 내며, 재보정은 한 번에 하나만 받는다. 가장 큰 경우는 검사 17개 × (파일 20MB + multipart 여유 64KB) +
    # 재보정 1개 × 256MB ≈ 597MB라 768m이면 들어가고, mem_limit 2g 안에도 든다. 공간이 모자라면 서비스는 그 업로드에
    # 503(Retry-After)으로 답하고 경고 로그를 남긴다. DEFECT_INSPECT_QUEUE를 늘리면 이 크기도 함께 늘린다. 메모리를
    # 아끼려면 대기열을 줄이는 쪽이 낫다(예: 대기열 4면 검사 5개 × 20MB + 256MB ≈ 357MB로 512m에 든다).
    tmpfs:
      - /tmp:size=768m
    mem_limit: 2g
    # 서비스는 Linux capability를 하나도 쓰지 않는다(uid 10001로 1024보다 큰 8000번 포트를 듣고, 파일은 /tmp에만
    # 쓴다). 그래서 모두 떼어 내고(cap_drop), setuid 실행 파일 같은 것으로 새 권한을 얻지 못하게 한다
    # (no-new-privileges). 컨테이너 안 코드가 뚫려도 쓸 수 있는 권한이 늘지 않는다.
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    # 프로세스·스레드 수 상한(pids cgroup은 스레드도 하나로 센다). 포크 폭탄 같은 폭주를 컨테이너 안에 가둔다. 서비스
    # 스레드는 대략 onnxruntime 연산 스레드(DEFECT_INSPECT_THREADS를 비우면 호스트 코어 수만큼) + anyio 스레드 풀(최대
    # 40) + 작업자(DEFECT_INSPECT_WORKERS, 기본 2) + 몇 개다. 128로 잡으면 코어가 80개쯤 넘는 큰 호스트에서 스레드를
    # 만들지 못해 시작이 실패할 수 있어 256으로 둔다. 2026-10-29 이 PC(논리 CPU 12, 물리 코어 6)에서 작은 시험
    # 아티팩트로 띄운 컨테이너는 쉴 때 35~37개, 동시 업로드 80개를 세 번 보내는 동안 최고 43개였다.
    pids_limit: 256
    restart: unless-stopped
    # 상태 점검: 이미지 안의 Python으로 /healthz를 부른다(curl이 이미지에 없다). start_period: 서비스는 시작할 때 모델
    # 지문 대조(134MB 파일의 SHA-256), 세션 생성, 세션마다 회색 이미지 예열 추론을 마친 뒤에야 응답하므로, 그동안의
    # 점검 실패는 재시도 횟수(retries)에 세지 않는다. 그 안에 한 번 성공하면 그때부터 보통 점검이다.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

# CI: push(main)와 pull request마다 세 작업을 따로 돌린다.
# - test: 기본 패키지 + dev·serve 그룹(torch와 데이터 없음)으로 ruff와 pytest. torch·데이터가 필요한 테스트는
#   스스로 건너뛴다(pytest.importorskip, data 표식). ruff 규칙에는 보안 규칙(S)도 들어 있다(pyproject.toml)
# - audit: pip-audit으로 두 취약점 데이터베이스(pip-audit 기본값인 PyPI의 취약점 정보, 그리고 OSV)와 두 번 대조한다.
#   먼저 서비스 이미지에 실제로 들어가는 의존성(기본 + serve, dev 제외)을 해시와 함께 대조하고(무시하는 권고 없음),
#   이어서 uv.lock의 모든 패키지(학습·개발 등 모든 그룹, Python 3.12 이상에서 쓰는 둘째 판까지)를 대조한다. 잠금 전체
#   대조는 docs/security.md에 받아들인 이유를 적은 학습 그룹의 세 권고만 무시한다(아래 단계 주석)
# - docker: Dockerfile로 서비스 이미지를 빌드하고, 작은 복원 방식 아티팩트 세트를 마운트해 기본 명령 그대로
#   띄운 뒤 /healthz와 /inspect를 부른다. 이어서 meta의 모델 지문이 틀린 세트로는 시작을 거절하는지, 배포 설정의
#   기대 지문(DEFECT_INSPECT_EXPECTED_MODEL_SHA256)이 맞으면 뜨고 그 목록에 없는 모델로는 뜨지 않는지 본다
#
# 보안 설정 (GitHub 공식 권고 "Security hardening for GitHub Actions"):
# - permissions: 모든 작업의 GITHUB_TOKEN을 저장소 읽기만으로 줄인다. 이 워크플로는 아무것도 쓰지 않는다
# - 외부 액션은 태그가 아니라 커밋 SHA로 고정한다(태그는 옮겨질 수 있다). 뒤의 주석이 그 SHA의 릴리스 이름이다.
#   갱신은 손으로 한다: `gh api repos/<소유자>/<저장소>/releases/latest`로 최신 릴리스를 찾고, 그 SHA를
#   `gh api repos/<소유자>/<저장소>/git/ref/tags/<태그>`로 확인해 바꾼다(object.type이 tag인 주석 태그면
#   `gh api repos/<소유자>/<저장소>/git/tags/<그 sha>`의 object.sha가 커밋이다). Dockerfile의 uv 이미지 태그도 같은
#   때에 `gh api repos/astral-sh/uv/releases/latest`로 확인해 올린다. 마지막 확인 2026-10-29: actions/checkout
#   v7.0.1(이미 최신), astral-sh/setup-uv v10.1.0 → v10.3.3, Dockerfile uv 0.12.12 → 0.13.6
# - checkout의 persist-credentials: false: 토큰을 .git/config에 남기지 않아, 뒤 단계의 프로그램이 읽지 못하게 한다
# - 러너는 ubuntu-latest 대신 ubuntu-24.04로 고정한다. GitHub이 2026-10-19부터 ubuntu-latest를 Ubuntu 26.04로
#   옮기고 있어, 고정하지 않으면 러너의 Python·Docker 판이 이 저장소의 변경 없이 바뀐다. 26.04로 옮길 때는 세
#   작업의 runs-on을 함께 바꾸고 세 작업이 모두 통과하는지 확인한다

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # setup-uv는 움직이는 큰 버전 태그(v10 등)를 내지 않으므로 정확한 릴리스의 SHA로 고정한다.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      # 기본 패키지와 dev·serve 그룹만: torch도 데이터셋도 없다. --frozen은 uv.lock을 다시 풀지 않고 그대로 쓴다.
      - name: Install dependencies
        run: uv sync --frozen --group serve

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest -q

  audit:
    runs-on: ubuntu-24.04
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # Dockerfile과 같은 집합(기본 + serve, dev 없음)을 uv.lock에서 해시와 함께 뽑아, 설치 없이(--disable-pip)
      # 그 고정 버전들을 대조한다. 알려진 취약점이 있으면 이 작업이 실패한다. pip-audit 버전은 고정한다.
      # 둘째 줄은 같은 목록을 OSV 데이터베이스(-s osv)와 한 번 더 대조한다. 데이터베이스마다 실린 권고가 달라서다
      # (2026-10-24 Pillow 12.3.0: PyPI 35건, OSV 39건이었고 PyPI에 없던 4건 중 하나가 critical). OSV 대조는 해시가
      # 있는지만 보고 값은 확인하지 않는다는 경고를 내는데, 해시 값 검증은 첫째 줄이 한다.
      - name: Audit the service dependencies
        run: |
          uv export --frozen --no-dev --group serve --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/serve.txt"
          uvx pip-audit@2.10.1 -r "$RUNNER_TEMP/serve.txt" --disable-pip --require-hashes --progress-spinner off
          uvx pip-audit@2.10.1 -r "$RUNNER_TEMP/serve.txt" --disable-pip --require-hashes --progress-spinner off -s osv

      # 잠금 파일 전체 대조. 위 단계는 서비스 이미지의 집합만 보고, pip-audit은 요구 줄의 환경 표지(`; python_full_version
      # >= '3.12'` 따위)를 자기를 돌리는 파이썬으로 판단해 맞지 않는 줄을 말없이 건너뛴다. 그래서 위 단계만으로는 서비스
      # 집합의 Python 3.11 갈래만 대조되고, 학습·개발 등 다른 그룹과 Python 3.12 이상에서 쓰는 둘째 판(numpy·scipy 등)은
      # 어느 대조에도 들지 않았다(2026-11-05 확인: 잠금 130개 가운데 22개, docs/security.md).
      # 이 단계는 모든 그룹을 내보내고(잠금에는 모든 플랫폼·파이썬 갈래가 들어 있다), 환경 표지를 떼고, torch·torchvision의
      # 로컬 판 표시(+cu128)를 떼어 PyPI의 같은 판으로 대조한다. pip-audit은 한 목록에 같은 이름이 두 번 나오면 거절하므로
      # 같은 이름의 둘째 판은 따로 목록을 만든다. 잠금에 고정된 판을 그대로 대조하므로 --no-deps --disable-pip이고,
      # --strict는 대조하지 못한 패키지가 하나라도 있으면 실패로 본다. 로컬 판 표시를 뗀 torch는 PyPI 파일과 해시가
      # 달라서 해시 없이 내보낸다(해시 검증은 위 단계가 서비스 집합에 한다). 내보낸 줄 수가 잠금의 패키지 수(프로젝트
      # 자신 하나를 뺀 값)와 다르면 대조 범위가 빠진 것이므로 멈춘다.
      # 무시하는 권고는 docs/security.md에 이유를 적고 받아들인 셋뿐이고, 모두 학습 그룹(torch가 끌어옴)에만 있어 서비스
      # 이미지에는 없다:
      #   PYSEC-2025-194 (torch 2.11.0, torch.jit.script의 메모리 손상): 고친 판 2.13.0은 다른 CUDA 인덱스에만 있고,
      #     torch를 올리면 학습·채점 환경이 바뀌어 측정을 다시 해야 한다
      #   PYSEC-2026-3447, GHSA-xmj3-9gf7-h52w (setuptools 81.0.0): torch 2.11.0이 setuptools<82를 요구해 올릴 수 없다.
      #     이 저장소는 setuptools로 소스 배포를 만들지 않고(빌드는 hatchling), 옛 방식 wheel 설치도 쓰지 않는다
      # 목록 하나나 데이터베이스 하나가 실패해도 나머지를 끝까지 대조해 로그에 남긴 뒤, 하나라도 실패했으면 마지막에
      # 실패로 끝낸다. shell: bash는 pipefail을 켜서 내보내기나 grep이 실패하면 빈 목록으로 지나가지 않고 바로 멈추게 한다.
      - name: Audit every locked package
        shell: bash
        run: |
          uv export --frozen --all-groups --no-emit-project --format requirements-txt --no-hashes --no-annotate > "$RUNNER_TEMP/locked.txt"
          grep -E '^[A-Za-z0-9]' "$RUNNER_TEMP/locked.txt" \
            | sed -E -e 's/[[:space:]]*;.*$//' -e 's/\+[^[:space:]]*$//' > "$RUNNER_TEMP/pinned.txt"
          locked=$(grep -c '^\[\[package\]\]' uv.lock)
          exported=$(wc -l < "$RUNNER_TEMP/pinned.txt")
          echo "uv.lock packages without the project: $((locked - 1)), exported for the audit: $exported"
          test "$exported" -eq "$((locked - 1))"
          awk -F'==' -v dir="$RUNNER_TEMP" '{
            name = tolower($1); gsub(/[-_.]+/, "-", name)
            print > (dir "/audit-" (++seen[name]) ".txt")
          }' "$RUNNER_TEMP/pinned.txt"
          status=0
          for list in "$RUNNER_TEMP"/audit-*.txt; do
            for service in pypi osv; do
              echo "== $(basename "$list"): $(wc -l < "$list") packages, $service"
              uvx pip-audit@2.10.1 -r "$list" --no-deps --disable-pip --strict --progress-spinner off -s "$service" \
                --ignore-vuln PYSEC-2025-194 --ignore-vuln PYSEC-2026-3447 --ignore-vuln GHSA-xmj3-9gf7-h52w || status=1
            done
          done
          exit "$status"

  docker:
    runs-on: ubuntu-24.04
    # 아래 onnx 임시 가상 환경의 Python. 저장소에 .python-version이 없어, 이 값이 없으면 uv가 러너의 python3(러너
    # 이미지마다 판이 다르다)를 잡는다.
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build the service image
        run: docker build -t defect-inspect:ci .

      # 작은 ONNX 모델과 범주 하나(toy)의 세트를 만든다(.github/ci/toy_artifact.py). bad/는 meta의 모델 지문을 일부러
      # 틀리게 적은 같은 세트다. onnx는 이 단계의 임시 가상 환경에만 설치한다. requirements-onnx.txt가 의존성까지
      # 판과 배포 파일 해시를 고정하고, --require-hashes가 내려받은 파일의 해시가 다르거나 해시 없는 패키지가 끼면
      # 설치를 멈춘다. `uv run --with-requirements`로 바로 돌리지 않는 것은, 그 방식이 해시가 틀린 파일도 설치했기
      # 때문이다(2026-10-29 uv 0.13.1로 확인, 캐시 없이도 같음).
      - name: Make toy artifact sets
        run: |
          uv venv "$RUNNER_TEMP/onnx-venv"
          uv pip install --python "$RUNNER_TEMP/onnx-venv" --require-hashes -r .github/ci/requirements-onnx.txt
          "$RUNNER_TEMP/onnx-venv/bin/python" .github/ci/toy_artifact.py "$RUNNER_TEMP/good"
          "$RUNNER_TEMP/onnx-venv/bin/python" .github/ci/toy_artifact.py "$RUNNER_TEMP/bad" --wrong-digest

      # compose.yaml과 같은 하드닝(읽기 전용 루트, /tmp tmpfs, 아티팩트 읽기 전용 마운트, 모든 Linux capability 제거,
      # setuid 등으로 새 권한을 얻지 못하게 함, 프로세스·스레드 수 상한 256)으로 기본 명령을 띄운다.
      # 회색 사진은 양품, 흰 칸이 있는 사진은 불량이어야 하고, 판정은 늘 "점수 > 임계값"이어야 한다.
      # 검사용 PNG는 이미지 안의 Python과 Pillow로 만든다(러너에는 Pillow가 없다).
      - name: Smoke test the image
        run: |
          docker run -d --name inspect --read-only --tmpfs /tmp:size=64m \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 256 -p 127.0.0.1:8000:8000 \
            -v "$RUNNER_TEMP/good:/artifacts:ro" defect-inspect:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/healthz > "$RUNNER_TEMP/health.json" && break
            sleep 1
          done
          python3 -c 'import json,sys; b=json.load(open(sys.argv[1])); assert b == {"status": "ok", "categories": ["toy"]}, b' "$RUNNER_TEMP/health.json"
          for kind in gray defect; do
            docker run --rm --entrypoint /app/.venv/bin/python defect-inspect:ci -c '
          import io, sys
          from PIL import Image
          image = Image.new("RGB", (64, 64), (128, 128, 128))
          if sys.argv[1] == "defect":
              image.paste((255, 255, 255), (16, 16, 32, 32))
          buffer = io.BytesIO()
          image.save(buffer, "PNG")
          sys.stdout.buffer.write(buffer.getvalue())
          ' "$kind" > "$RUNNER_TEMP/$kind.png"
            curl -fsS -F "image=@$RUNNER_TEMP/$kind.png;type=image/png" -F category=toy \
              http://127.0.0.1:8000/inspect > "$RUNNER_TEMP/$kind.json"
            python3 - "$RUNNER_TEMP/$kind.json" "$kind" <<'EOF'
          import json, sys
          body = json.load(open(sys.argv[1]))
          assert body["is_defect"] is (body["score"] > body["threshold"]), body
          assert body["is_defect"] is (sys.argv[2] == "defect"), body
          print(sys.argv[2], body["score"], body["threshold"], body["is_defect"])
          EOF
          done

      # 모델 지문이 meta와 다르면 서비스가 아예 뜨지 않아야 한다(조용히 다른 모델로 판정하지 않게). 위와 같은 하드닝
      # 옵션으로 띄워, 거절이 그 옵션 때문이 아니라 지문 대조 때문임을 로그 문구로 확인한다.
      - name: A mismatched model digest stops the service
        run: |
          docker run -d --name bad --read-only --tmpfs /tmp:size=64m \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 256 \
            -v "$RUNNER_TEMP/bad:/artifacts:ro" defect-inspect:ci
          status=$(timeout 60 docker wait bad)
          docker logs bad > "$RUNNER_TEMP/bad.log" 2>&1
          test "$status" -ne 0
          grep -q "does not match the artifact meta" "$RUNNER_TEMP/bad.log"
          echo "exit status $status"

      # 배포 설정의 기대 지문(DEFECT_INSPECT_EXPECTED_MODEL_SHA256). meta 대조는 같은 볼륨 안의 기록과 비교하므로
      # 폴더를 통째로 바꿔 끼우면 통과한다. 이 설정은 볼륨 밖에서 승인한 모델 파일 지문으로 막는다(대조하는 것은
      # 모델 파일뿐이고 meta.json의 임계값과 PatchCore 뱅크는 대조하지 않는다). 먼저 good 세트의 실제
      # 지문을 대문자로, 쓰이지 않는 다른 지문과 쉼표·공백으로 섞어 주면 뜨고 /categories가 그 지문의 앞 12자를
      # 보이는지 본다. 이어서 같은 good 세트에 목록에 없는 지문만 주면 뜨지 않는지를 종료 코드와 로그 문구로 본다.
      - name: Model files the deployment did not approve stop the service
        run: |
          digest=$(sha256sum "$RUNNER_TEMP/good/model_fp32.onnx" | cut -d ' ' -f 1)
          other=$(printf '%064d' 0)
          upper=$(printf '%s' "$digest" | tr 'a-f' 'A-F')
          docker run -d --name pinned --read-only --tmpfs /tmp:size=64m \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 256 -p 127.0.0.1:8001:8000 \
            -e DEFECT_INSPECT_EXPECTED_MODEL_SHA256="$other, $upper" \
            -v "$RUNNER_TEMP/good:/artifacts:ro" defect-inspect:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8001/categories > "$RUNNER_TEMP/pinned.json" && break
            sleep 1
          done
          python3 -c 'import json,sys; b=json.load(open(sys.argv[1])); assert [c["model_sha256"] for c in b] == [sys.argv[2][:12]], b' "$RUNNER_TEMP/pinned.json" "$digest"
          docker run -d --name stranger --read-only --tmpfs /tmp:size=64m \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 256 \
            -e DEFECT_INSPECT_EXPECTED_MODEL_SHA256="$other" \
            -v "$RUNNER_TEMP/good:/artifacts:ro" defect-inspect:ci
          status=$(timeout 60 docker wait stranger)
          docker logs stranger > "$RUNNER_TEMP/stranger.log" 2>&1
          test "$status" -ne 0
          grep -q "is not one of the expected model digests in DEFECT_INSPECT_EXPECTED_MODEL_SHA256" "$RUNNER_TEMP/stranger.log"
          echo "exit status $status"

      - name: Container logs
        if: always()
        run: |
          docker logs inspect || true
          docker logs bad || true
          docker logs pinned || true
          docker logs stranger || true

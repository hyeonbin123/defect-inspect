# HawkScan(StackHawk) 설정. 이 파일에는 비밀값이 없다. 스캔 대상은 모델 파일 없이 합성 범주 `demo`로 도는
# 서비스이고, 그 서비스가 OpenAPI 설명을 내준다. 일회용 관리자 토큰으로 재보정을 켜서, 스캔이 POST/DELETE
# /calibrate까지 닿게 한다:
#
#   ADMIN_TOKEN=$(python -c "import secrets; print(secrets.token_urlsafe(24))")
#   DEFECT_INSPECT_ADMIN_TOKEN=$ADMIN_TOKEN uv run uvicorn defect_inspect.service:create_offline_app --factory --port 8093
#   APP_ID=<application id> ADMIN_TOKEN=$ADMIN_TOKEN COMMIT_SHA=$(git rev-parse HEAD) hawk scan
#
# 아티팩트 세트로 띄운 서비스(create_app)에는 `demo` 범주가 없다: 그 세트의 범주 하나로 만든 시드를 SEED_HAR로
# 준다(예: SEED_HAR=hawk/seed-pcb1.har). zap/automation.yaml은 같은 스캔을 OWASP ZAP으로 하는 설정이다.
app:
  applicationId: ${APP_ID}
  env: ${APP_ENV:Development}
  host: ${APP_HOST:http://127.0.0.1:8093}
  openApiConf:
    path: /openapi.json
  authentication:
    # 관리자 토큰은 밖에서 주고 만료되지 않는다. 그래서 로그인 표시자(indicator)는 일부러 아무것도 거르지 않게
    # 두고, 실제 확인은 testPath가 한다. testPath는 DELETE를 보낼 수 없어 빈 재보정을 POST한다: 헤더가 없으면
    # 본문을 읽기 전에 보호 장치가 403으로 답하고, 있으면 요청이 본문 검증(422)까지 간다.
    loggedInIndicator: ".*"
    loggedOutIndicator: "$^"
    external:
      values:
        - type: TOKEN
          value:
            name: X-Admin-Token
            val: ${ADMIN_TOKEN}
    testPath:
      path: /calibrate
      requestMethod: POST
      fail: ".*403.*"
hawk:
  spider:
    # 실제 multipart 요청(hawk/make_seed_har.py가 만든다). OpenAPI로는 이미지 업로드를 만들 수 없어, 이것이
    # 없으면 모든 POST /inspect와 POST /calibrate가 폼 검증(422)에서 멈춘다.
    har:
      file:
        paths:
          - ${SEED_HAR:hawk/seed.har}
tags:
  - name: _STACKHAWK_GIT_COMMIT_SHA
    value: ${COMMIT_SHA:none}
  - name: _STACKHAWK_GIT_BRANCH
    value: ${BRANCH_NAME:none}
  - name: git_origin
    value: hyeonbin123/defect-inspect
  - name: _STACKHAWK_AGENT
    value: ${HAWK_AGENT:none}

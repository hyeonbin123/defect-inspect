[project]
name = "defect-inspect"
version = "0.1.0"
description = "Anomaly detection for visual inspection, measured with pre-registered rules: fixed thresholds, condition shift, few defect labels, CPU latency"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pillow>=11.0",
    "scipy>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    # 지표 테스트에서 기준 구현으로만 쓴다(직접 쓴 AUROC 등을 대조).
    "scikit-learn>=1.5",
    # 서비스 테스트의 TestClient가 쓴다.
    "httpx>=0.27",
]
# 검사 서비스와 그 ONNX Runtime 추론(torch 없음). Docker 이미지가 이 그룹을 넣고, CI도 설치한다.
serve = [
    "onnxruntime>=1.22",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]
# 특징 추출, 메모리 뱅크, 학습(GPU). 기본 패키지의 어떤 모듈도 이것들을 모듈 수준에서 가져오지 않으므로 CI
# 테스트는 이 그룹 없이 돈다.
train = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "timm>=1.0",
    # 백본의 ONNX 내보내기와 양자화(4단계).
    "onnx>=1.17",
    "onnxscript>=0.2",
    "onnxruntime>=1.22",
]
# Dinomaly 모델 코드(2단계). run_dinomaly.py만 가져다 쓴다. `train`과 함께 설치한다.
dinomaly = [
    "anomalib==2.6.2",
    "torch==2.11.0",
    "torchvision==0.26.0",
]
figures = [
    "matplotlib>=3.9",
]
# CPU 런타임 대조(runtime_compare.py)의 OpenVINO 팔. 서비스 이미지에는 넣지 않는다.
openvino = [
    "openvino==2026.4.1",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/defect_inspect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
markers = [
    "torch: needs the train dependency group (skipped when torch is not installed)",
    "data: needs the downloaded dataset under data/ (skipped when it is missing)",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

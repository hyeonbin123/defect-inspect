[project]
name = "defect-inspect"
version = "0.1.0"
description = "Anomaly detection for visual inspection, measured with pre-registered rules: fixed thresholds, condition shift, few defect labels, CPU latency"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    # 13.0 이상: 12.3.0까지의 판에 걸린 공개 보안 권고(서비스가 받는 TIFF·PNG·BMP 디코딩 경로 포함)가
    # 13.0.0에서 고쳐졌다. 도달 분석과 회귀 테스트는 docs/security.md의 의존성 취약점 대조 절에 있다.
    "pillow>=13.0",
    "scipy>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    # 지표 테스트에서 기준 구현으로만 쓴다(직접 쓴 AUROC 등을 대조).
    "scikit-learn>=1.5",
    # 서비스 테스트의 TestClient가 쓴다.
    "httpx>=0.27",
]
# 검사 서비스와 그 ONNX Runtime 추론(torch 없음). Docker 이미지가 이 그룹을 넣고, CI도 설치한다.
serve = [
    "onnxruntime>=1.22",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]
# 특징 추출, 메모리 뱅크, 학습(GPU). 기본 패키지의 어떤 모듈도 이것들을 모듈 수준에서 가져오지 않으므로 CI
# 테스트는 이 그룹 없이 돈다.
train = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "timm>=1.0",
    # 백본의 ONNX 내보내기와 양자화(4단계).
    "onnx>=1.17",
    "onnxscript>=0.2",
    "onnxruntime>=1.22",
]
# Dinomaly 모델 코드(2단계). run_dinomaly.py만 가져다 쓴다. `train`과 함께 설치한다.
dinomaly = [
    "anomalib==2.6.2",
    "torch==2.11.0",
    "torchvision==0.26.0",
]
figures = [
    "matplotlib>=3.9",
]
# CPU 런타임 대조(runtime_compare.py)의 OpenVINO 팔. 서비스 이미지에는 넣지 않는다.
openvino = [
    "openvino==2026.4.1",
]

# torch·torchvision의 CUDA 12.8 빌드를 받는 PyTorch 인덱스. explicit이라 아래 [tool.uv.sources]에 적은 두
# 패키지만 여기서 받는다. 2026-10-24에 확인한 이 인덱스의 마지막 판은 torch 2.11.0·torchvision 0.26.0이고,
# 그보다 새 판(예: CVE-2025-3000이 고쳐진 torch 2.13.0)은 cu130·cu132 같은 새 CUDA 인덱스에만 있다. 올릴 때는
# 인덱스를 바꾸고, 새 빌드가 이 GPU(RTX 2080 Ti)를 지원하는지 확인한 뒤, 학습·채점 결과가 바뀔 수 있으므로
# 새 등록 항목(docs/experiments.md)으로 GPU 측정을 다시 한다. 이 두 패키지는 PyPI에 없는 판이라 pip-audit이
# 건너뛰므로 OSV에 직접 조회한다(docs/security.md의 로컬 감사 절차).
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/defect_inspect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
markers = [
    "torch: needs the train dependency group (skipped when torch is not installed)",
    "data: needs the downloaded dataset under data/ (skipped when it is missing)",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# S: flake8-bandit 보안 규칙(assert 사용, 셸·부분 경로 subprocess, urlopen의 scheme, 약한 해시, 하드코딩한 비밀값
# 등). src에서 남긴 예외는 그 줄의 `# noqa: S…`와 바로 위 주석에 사유를 적었다.
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# 테스트에서만 끄는 보안 규칙과 사유:
# - S101: pytest는 assert로 단언한다.
# - S105: 테스트용 관리자 토큰("test-admin-token")은 비밀값이 아니다.
# - S603·S607: 테스트가 고정 인자 목록으로 git과 이 인터프리터(sys.executable)를 셸 없이 띄운다(장부의 git 기록,
#   torch 없는 import 확인 등). 인자는 테스트 안의 상수와 임시 폴더 경로뿐이다.
"tests/**" = ["S101", "S105", "S603", "S607"]

[project]
name = "defect-inspect"
version = "0.1.0"
description = "Anomaly detection for visual inspection, measured with pre-registered rules: fixed thresholds, condition shift, few defect labels, CPU latency"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pillow>=11.0",
    "scipy>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    # Reference implementations for metric tests only.
    "scikit-learn>=1.5",
    # TestClient for the service tests.
    "httpx>=0.27",
]
# The inspection service and its ONNX Runtime inference (no torch). CI installs this group too.
serve = [
    "onnxruntime>=1.22",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]
# Feature extraction, memory banks and training (GPU). Nothing in the base package imports these at
# module level, and the CI tests run without them.
train = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "timm>=1.0",
    # ONNX export and quantization of the backbone (stage 4).
    "onnx>=1.17",
    "onnxscript>=0.2",
    "onnxruntime>=1.22",
]
# Dinomaly model code (stage 2). Only run_dinomaly.py imports it; install together with `train`.
dinomaly = [
    "anomalib==2.6.2",
    "torch==2.11.0",
    "torchvision==0.26.0",
]
figures = [
    "matplotlib>=3.9",
]
# The OpenVINO arm of the CPU runtime comparison (runtime_compare.py). Not part of the service image.
openvino = [
    "openvino==2026.4.1",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/defect_inspect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
markers = [
    "torch: needs the train dependency group (skipped when torch is not installed)",
    "data: needs the downloaded dataset under data/ (skipped when it is missing)",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
